            <div class="form-group">
                <label for="printerIP">Impresora</label>

                    <option value="10.0.112.48">Planificación</option>
                    <option value="10.0.112.25">Sistemas</option>
                    <option value="127.0.0.1">Virtual</option>

            </div>

            <button type="submit" class="btn">Imprimir etiquetas</button>
