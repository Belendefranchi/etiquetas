        <div class="navbar-brand">
            <img src="../images/logo.png" alt="Logo">

<!-- ================= CONTENIDO ================= -->

<div class="container">
    <div class="card">

        <h1>Etiquetas Contenedores</h1>

        <form action="../core/procesar.php" method="post">

            <div class="form-group">
                <label for="tipo_etiqueta">Tipo de etiqueta</label>

                <select name="tipo_etiqueta" id="tipo_etiqueta" required>
                    <option value="">Seleccionar...</option>
                    <option value="CuF">Cubetas filo</option>
                    <option value="CuL">Cubetas lateral</option>
                    <option value="CF">Gavetas chicas frente</option>
                    <option value="CL">Gavetas chicas lateral</option>
                    <option value="GF">Gavetas grandes frente</option>
                    <option value="GL">Gavetas grandes lateral</option>
                    <option value="R">Rack</option>
                    <option value="M">Minirack</option>
                    <option value="Li">Livianas</option>
                    <option value="Di">Dinámicas</option>
                    <option value="H">Heladera</option>
                    <option value="A">Alcoholera</option>
                </select>
            </div>

            <div class="form-group">
                <label for="valor_inicial">Valor inicial</label>
                <input type="text" name="valor_inicial" id="valor_inicial" required>
            </div>

            <div class="form-group">
                <label for="valor_final">Valor final</label>
                <input type="text" name="valor_final" id="valor_final" required>
            </div>

            <div class="form-group">
                <label for="printerIP">Impresora</label>

                <select name="printerIP" id="printerIP">

                    <option value="10.0.112.48">
                        Planificación
                    </option>

                    <option value="10.0.112.25">
                        Sistemas
                    </option>

                    <option value="127.0.0.1">
                        Virtual
                    </option>

                </select>
            </div>

            <button type="submit" class="btn">
                Imprimir etiquetas
            </button>

        </form>

        <div class="footer-note">
        </div>

    </div>
</div>

</body>
</html>
